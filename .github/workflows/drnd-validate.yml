# DrND fork: tests and validation only. This workflow never deploys, uses no secrets and cannot reach Cloudflare.
# Actions are pinned to the same commits as the upstream workflow.
name: DrND validate

on:
  push:
    branches: ['drnd/**']
  pull_request:
    branches: [main, 'drnd/production']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drnd-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:host
      - name: R2 asset gate and Pages bundle (no upload, no deployment)
        run: deploy/cloudflare-pages/prepare_dist.sh dist "$RUNNER_TEMP/r2-stash"
      - name: Registered-asset and publication checks
        run: |
          python3 scripts/test_registered_anatomy.py
          python3 scripts/test_publication.py
          python3 scripts/check_publication.py --tracked
